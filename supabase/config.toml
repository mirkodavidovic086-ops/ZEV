project_id = "mojzev"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "mojzev://prijava"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Registracija je otvorena, ali korisnik bez članstva ne vidi nikakve podatke
# (RLS). Pristup zgradi se dobija isključivo kroz pozivnicu.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Magic link / email OTP — bez lozinki.
double_confirm_changes = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Provajder se konfiguriše kroz secrets; za lokalni razvoj koristi se test OTP.
template = "Vas MojZEV kod je {{ .Code }}"

[auth.sms.test_otp]
# Brojevi za lokalni razvoj — ne šalju stvarni SMS.
"38761000001" = "123456"
"38761000002" = "123456"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
